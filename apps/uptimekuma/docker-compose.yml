---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped

    ports:
      - "${APP_PORT_PREFIX:-16}580:3001"

    volumes:
      - ${APP_DIR:-/volumes/containers/uptime-kuma}/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
