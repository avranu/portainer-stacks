---
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-}
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APP_DIR:-/volumes/containers/observability}/prometheus/alerts:/etc/prometheus/alerts:ro
      - ${APP_DIR:-/volumes/containers/observability}/prometheus/file_sd:/etc/prometheus/file_sd:ro
      - ${APP_DIR:-/volumes/containers/observability}/prometheus:/prometheus
      #- /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}090:9090"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${APP_DIR:-/volumes/containers/observability}/alertmanager:/alertmanager
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/loki/config.yml:/etc/loki/config.yml:ro
      - ${APP_DIR:-/volumes/containers/observability}/loki:/loki
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.5
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?set in stack.env}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set in stack.env}
      - GF_SECURITY_ADMIN_EMAIL=${GF_SECURITY_ADMIN_EMAIL:-admin@mydomain.com}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-grafana.local}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-}
    ports:
      - "${APP_PORT_PREFIX:-33}300:3000"
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/grafana:/var/lib/grafana
      - ${APP_DIR:-/volumes/containers/observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${APP_DIR:-/volumes/containers/observability}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:2.9.5
    container_name: promtail
    command:
      - --config.file=/etc/promtail/config.yml
      - --config.expand-env=true
    environment:
      - PROMTAIL_HOSTNAME=${PROMTAIL_HOSTNAME:-${HOSTNAME:-observability}}
      - PROMTAIL_ENVIRONMENT=${PROMTAIL_ENVIRONMENT:-homelab}
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/promtail/config.yml:/etc/promtail/config.yml:ro
      - ${APP_DIR:-/volumes/containers/observability}/promtail/positions.yaml:/var/lib/promtail/positions.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - monitoring
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+|run/containers/.+)$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}910:9100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --enable_load_reader=true
      - --docker_only
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}080:8080"
    depends_on:
      - node-exporter
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ${APP_DIR:-/volumes/containers/observability}/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    ports:
      - "${APP_PORT_PREFIX:-33}915:9115"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  monitoring:
    name: monitoring
