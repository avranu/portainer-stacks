---
# See here: https://docs.karakeep.app/installation/docker/
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    container_name: karakeep_web
    restart: unless-stopped
    ports:
      - "${APP_PORT_PREFIX:-16}300:3000" # Host port 16300 -> container 3000 (web UI)
    environment:
      # --- REQUIRED SECRETS ---
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-tAEMUjguFJrXRMbeI6G9dmrRJIBqSz7H}"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-wthR5DGaF2hnA7FBYDK5fHlhRdzIkWn4}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:16300}"

      # --- APP CONFIG ---
      MEILI_ADDR: "http://meilisearch:7700"
      BROWSER_WEB_URL: "http://chrome:16922"
      DATA_DIR: /data
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_healthy
    volumes:
      - ${APP_DIR:-/volumes/containers/karakeep}/data:/data

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: karakeep_chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=16922
      - --hide-scrollbars
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:16922/json/version >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: karakeep_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-wthR5DGaF2hnA7FBYDK5fHlhRdzIkWn4}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7700/health | grep -q 'available'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - ${APP_DIR:-/volumes/containers/karakeep}/meili:/meili_data
