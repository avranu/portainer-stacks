services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASS}
      - TZ=${TZ:-UTC}
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/auth/config.toml
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/gluetun:/gluetun
      - ${APP_DIR:-/volumes/containers/torrents}/gluetun/auth:/gluetun/auth:ro
    ports:
      - "${APP_PORT_PREFIX:-23}080:23080"
    restart: always

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent
    network_mode: "service:gluetun"
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      - gluetun
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/qbittorrent/config:/config
      - ${MEDIA_DIR:-/storage/media}/adult/downloads:/downloads/adult
      - ${MEDIA_DIR:-/storage/media}/movies/downloads:/downloads/movies
      - ${MEDIA_DIR:-/storage/media}/tv/downloads:/downloads/tv
      - ${MEDIA_DIR:-/storage/media}/books/downloads:/downloads/books
      - ${MEDIA_DIR:-/storage/media}/music/downloads:/downloads/music
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/adult/library:/library/adult
      - ${MEDIA_DIR:-/storage/media}/movies/library:/library/movies
      - ${MEDIA_DIR:-/storage/media}/tv/library:/library/tv
      - ${MEDIA_DIR:-/storage/media}/books/library:/library/books
      - ${MEDIA_DIR:-/storage/media}/music/library:/library/music
      - ${MEDIA_DIR:-/storage/media}/adult/crosslinks:/crosslinks/adult
      - ${MEDIA_DIR:-/storage/media}/movies/crosslinks:/crosslinks/movies
      - ${MEDIA_DIR:-/storage/media}/tv/crosslinks:/crosslinks/tv
      - ${MEDIA_DIR:-/storage/media}/books/crosslinks:/crosslinks/books
      - ${MEDIA_DIR:-/storage/media}/music/crosslinks:/crosslinks/music
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=23080
      - DOCKER_MODS=ghcr.io/t-anc/gsp-qbittorent-gluetun-sync-port-mod:main
      - GSP_GTN_API_KEY=${GSP_GTN_API_KEY}
      # optional (nice while validating):
      - GSP_MINIMAL_LOGS=false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${WEBUI_PORT:-8080}/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  readarr:
    image: ghcr.io/hotio/readarr
    container_name: readarr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}787:8787" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/readarr/config:/config
      - ${MEDIA_DIR:-/storage/media}/books/downloads:/downloads/books
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/books/library/audiobooks/library:/library/books
      - ${MEDIA_DIR:-/storage/media}/books/library/podcasts/library:/library/podcasts
      - ${MEDIA_DIR:-/storage/media}/books/crosslinks:/crosslinks/books
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8787/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  radarr:
    image: ghcr.io/hotio/radarr
    container_name: radarr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}878:7878" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/radarr/config:/config
      - ${MEDIA_DIR:-/storage/media}/movies/downloads:/downloads/movies
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/movies/library:/library/movies
      - ${MEDIA_DIR:-/storage/media}/movies/crosslinks:/crosslinks/movies
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7878/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  sonarr:
    image: ghcr.io/hotio/sonarr
    container_name: sonarr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}989:8989" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/sonarr/config:/config
      - ${MEDIA_DIR:-/storage/media}/tv/downloads:/downloads/tv
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/tv/library:/library/tv
      - ${MEDIA_DIR:-/storage/media}/tv/crosslinks:/crosslinks/tv
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8989/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  lidarr:
    image: ghcr.io/hotio/lidarr
    container_name: lidarr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}686:8686" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/lidarr/config:/config
      - ${MEDIA_DIR:-/storage/media}/music/downloads:/downloads/music
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/music/library:/library/music
      - ${MEDIA_DIR:-/storage/media}/music/crosslinks:/crosslinks/music
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8686/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  whisparr:
    image: ghcr.io/hotio/whisparr:v3
    container_name: whisparr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}969:6969" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/whisparr/config:/config
      - ${MEDIA_DIR:-/storage/media}/adult/downloads:/downloads/adult
      - ${MEDIA_DIR:-/storage/media}/downloads:/downloads/other
      - ${MEDIA_DIR:-/storage/media}/adult/library:/library/adult
      - ${MEDIA_DIR:-/storage/media}/adult/crosslinks:/crosslinks/adult
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:6969/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  prowlarr:
    image: ghcr.io/hotio/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
      - UMASK=${UMASK:-022}
    ports:
      - "${APP_PORT_PREFIX:-23}696:9696" # host:container
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/prowlarr/config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9696/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8191/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    environment:
      - PUID=${APP_UID:-568}
      - PGID=${APP_GID:-568}
      - TZ=${TZ:-UTC}
    ports:
      - "${APP_PORT_PREFIX:-23}096:8096" # HTTP
      - "${APP_PORT_PREFIX:-23}443:8920" # HTTPS (optional)
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/jellyfin/config:/config
      - ${APP_DIR:-/volumes/containers/torrents}/jellyfin/cache:/cache
      - ${MEDIA_DIR:-/storage/media}/movies/library:/media/movies
      - ${MEDIA_DIR:-/storage/media}/tv/library:/media/tv
      - ${MEDIA_DIR:-/storage/media}/music/library:/media/music
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8096/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 90s
      timeout: 10s
      retries: 3

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-UTC}
      - PORT=23058
    ports:
      - "${APP_PORT_PREFIX:-23}058:23058"
    volumes:
      - ${APP_DIR:-/volumes/containers/torrents}/jellyseerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:23058/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
